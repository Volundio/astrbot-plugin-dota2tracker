<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="views.diagnostics.title">Diagnostics</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --border: #dde1e6;
  --text: #1f2328;
  --muted: #646d78;
  --accent: #3b6fd8;
  --accent-text: #ffffff;
  --ok: #1d7f45;
  --ok-bg: #e3f4ea;
  --warn: #93600a;
  --warn-bg: #fdf2dc;
  --danger: #c0352b;
  --danger-bg: #fbe6e4;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  --overlay: rgba(15, 23, 42, 0.35);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16181d;
  --surface: #1f2228;
  --surface-2: #272b33;
  --border: #353a44;
  --text: #e6e8eb;
  --muted: #9aa3ae;
  --accent: #6c9cff;
  --accent-text: #0e1420;
  --ok: #5fd08f;
  --ok-bg: #1b3326;
  --warn: #f0c063;
  --warn-bg: #3a2f17;
  --danger: #ff8a80;
  --danger-bg: #3d1f1d;
  --shadow: none;
  --overlay: rgba(0, 0, 0, 0.55);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.page-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 14px; }
.page-header .spacer { flex: 1; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.stack > * + * { margin-top: 12px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-head h2, .card-head h3 { margin: 0; }
.card-head .spacer { flex: 1; }
dl.kv { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 4px 12px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.stat .value { font-size: 20px; font-weight: 600; }
.stat .label { color: var(--muted); font-size: 12px; }
button, .btn {
  font: inherit;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
button.small { padding: 2px 8px; font-size: 12px; }
input[type="text"], input[type="search"], select {
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  min-width: 0;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; }
.badge {
  display: inline-block;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 20px;
  background: var(--surface-2);
  color: var(--muted);
  white-space: nowrap;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid transparent; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.banner.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
.banner.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.state { padding: 24px 12px; text-align: center; color: var(--muted); }
.state.error { color: var(--danger); }
.state button { margin-top: 8px; }
.spinner {
  display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px;
  border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.actions { white-space: nowrap; text-align: right; }
td.actions button + button { margin-left: 6px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li + li { margin-top: 6px; }
/* Narrow layout: tables collapse into labelled rows. */
@media (max-width: 640px) {
  body { padding: 10px; }
  table.responsive thead { display: none; }
  table.responsive, table.responsive tbody, table.responsive tr, table.responsive td { display: block; width: 100%; }
  table.responsive tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
  table.responsive tr:last-child { border-bottom: none; }
  table.responsive td { border: none; padding: 2px 4px; display: flex; gap: 8px; }
  table.responsive td::before { content: attr(data-label); color: var(--muted); min-width: 96px; flex-shrink: 0; font-size: 12px; }
  table.responsive td.actions { justify-content: flex-start; text-align: left; }
  table.responsive td.actions::before { content: none; }
}
/* In-page confirm dialog (window.confirm is unavailable in the sandboxed iframe). */
.overlay {
  position: fixed; inset: 0; background: var(--overlay);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
}
.dialog {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px; width: min(420px, 100%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}
.dialog p { margin: 8px 0 16px; overflow-wrap: anywhere; }
.dialog .toolbar { justify-content: flex-end; }
.toast-area { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: calc(100% - 32px); }
.toast { border-radius: 6px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15); }
.toast.ok { border-color: var(--ok); color: var(--ok); }
.toast.danger { border-color: var(--danger); color: var(--danger); }
.check-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.check-row + .check-row { margin-top: 8px; }
.check-row .name { min-width: 90px; font-weight: 500; }
.check-row .result { flex: 1; min-width: 160px; }
pre.config { margin: 0; max-height: 360px; overflow: auto; background: var(--surface-2); padding: 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
details summary { cursor: pointer; }
</style>
<script src="/api/plugin/page/bridge-sdk.js"></script>
</head>
<body>
<header class="page-header">
  <h1 data-i18n="views.diagnostics.title">Diagnostics</h1>
  <span class="spacer"></span>
  <div class="toolbar">
    <button type="button" id="download" data-i18n="views.diagnostics.download"></button>
    <button type="button" id="reload" data-i18n="views.common.reload"></button>
  </div>
</header>
<main id="content"></main>

<script>
/* ---- shared helpers (identical in every dota2tracker view) ---- */
const bridge = window.AstrBotPluginView || null;

/** Translate a key relative to the plugin i18n root; `{name}` placeholders are filled from vars. */
function t(key, vars, fallback) {
  let text = bridge ? bridge.t(key, "") : "";
  if (!text) text = fallback !== undefined ? fallback : key;
  if (vars) {
    text = text.replace(/\{(\w+)\}/g, (m, name) => (vars[name] === undefined || vars[name] === null ? m : String(vars[name])));
  }
  return text;
}

function hasKey(key) {
  return Boolean(bridge && bridge.t(key, ""));
}

function locale() {
  return (bridge && bridge.getLocale()) || "zh-CN";
}

/** Apply data-i18n / data-i18n-title / data-i18n-placeholder / data-i18n-aria attributes. */
function applyI18n(root) {
  const scope = root || document;
  scope.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
  scope.querySelectorAll("[data-i18n-title]").forEach((node) => { node.title = t(node.dataset.i18nTitle); });
  scope.querySelectorAll("[data-i18n-placeholder]").forEach((node) => { node.placeholder = t(node.dataset.i18nPlaceholder); });
  scope.querySelectorAll("[data-i18n-aria]").forEach((node) => { node.setAttribute("aria-label", t(node.dataset.i18nAria)); });
  document.documentElement.lang = locale();
}

/** Build DOM safely: strings become text nodes, never HTML. */
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (name === "class") node.className = value;
    else if (name === "text") node.textContent = value;
    else if (name.startsWith("on") && typeof value === "function") node.addEventListener(name.slice(2), value);
    else if (name in node && typeof value !== "string") node[name] = value;
    else node.setAttribute(name, value === true ? "" : String(value));
  }
  append(node, children);
  return node;
}

function append(node, children) {
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

function setContent(node, ...children) {
  return append(clear(node), children);
}

function fmtTime(unixSeconds) {
  if (unixSeconds === undefined || unixSeconds === null || unixSeconds === 0) return t("views.common.never");
  const date = new Date(Number(unixSeconds) * 1000);
  if (Number.isNaN(date.getTime())) return String(unixSeconds);
  try {
    return new Intl.DateTimeFormat(locale(), { dateStyle: "medium", timeStyle: "medium" }).format(date);
  } catch {
    return date.toLocaleString();
  }
}

function fmtNumber(value) {
  if (value === undefined || value === null) return "-";
  try {
    return new Intl.NumberFormat(locale()).format(value);
  } catch {
    return String(value);
  }
}

function fmtBytes(bytes) {
  const n = Number(bytes) || 0;
  if (n < 1024) return `${fmtNumber(n)} B`;
  if (n < 1024 * 1024) return `${fmtNumber(Math.round(n / 102.4) / 10)} KB`;
  return `${fmtNumber(Math.round(n / 104857.6) / 10)} MB`;
}

function badge(text, kind) {
  return h("span", { class: `badge ${kind || ""}`.trim(), text });
}

function yesNoBadge(value, onKey, offKey, offKind) {
  return value ? badge(t(onKey || "views.common.enabled"), "ok") : badge(t(offKey || "views.common.disabled"), offKind || "");
}

/** Map a bridge error (message is a backend error code) to translated text. */
function errorText(error) {
  const code = String((error && error.message) || error || "").trim();
  if (/^[a-z0-9_]+$/.test(code) && hasKey(`views.common.errors.${code}`)) return t(`views.common.errors.${code}`);
  if (/^invalid_[a-z0-9_]+$/.test(code)) return t("views.common.errors.invalid_param", { name: code.slice(8) });
  return t("views.common.errors.unknown", { message: code || "?" });
}

/** Loading / empty / error placeholder. */
function stateBox(kind, text, retry) {
  const box = h("div", { class: `state ${kind}`, role: kind === "error" ? "alert" : "status" });
  if (kind === "loading") box.appendChild(h("span", { class: "spinner", "aria-hidden": "true" }));
  box.appendChild(document.createTextNode(text || t(`views.common.${kind}`)));
  if (retry) box.append(h("br"), h("button", { type: "button", onclick: retry, text: t("views.common.retry") }));
  return box;
}

let toastArea = null;
function toast(text, kind) {
  if (!toastArea) {
    toastArea = h("div", { class: "toast-area", role: "status", "aria-live": "polite" });
    document.body.appendChild(toastArea);
  }
  const node = h("div", { class: `toast ${kind || ""}`, text });
  toastArea.appendChild(node);
  setTimeout(() => node.remove(), kind === "danger" ? 6000 : 3000);
}

/** In-page confirmation dialog; resolves true/false. */
function askConfirm(message, { title, confirmText, danger = true } = {}) {
  return new Promise((resolve) => {
    const previous = document.activeElement;
    const close = (result) => {
      overlay.remove();
      document.removeEventListener("keydown", onKey);
      if (previous && previous.focus) previous.focus();
      resolve(result);
    };
    const onKey = (event) => { if (event.key === "Escape") close(false); };
    const ok = h("button", { type: "button", class: danger ? "danger" : "primary", text: confirmText || t("views.common.confirm"), onclick: () => close(true) });
    const overlay = h("div", { class: "overlay", onclick: (event) => { if (event.target === overlay) close(false); } },
      h("div", { class: "dialog", role: "alertdialog", "aria-modal": "true" },
        h("h3", { text: title || t("views.common.confirmTitle") }),
        h("p", { text: message }),
        h("div", { class: "toolbar" },
          h("button", { type: "button", text: t("views.common.cancel"), onclick: () => close(false) }),
          ok)));
    document.addEventListener("keydown", onKey);
    document.body.appendChild(overlay);
    ok.focus();
  });
}

/** Disable a button while an async action runs. */
async function busy(button, action) {
  if (button) button.disabled = true;
  try {
    return await action();
  } finally {
    if (button) button.disabled = false;
  }
}

/** Start the view: wait for the bridge context, then re-render on every language/theme change. */
async function boot(onContext) {
  if (!bridge) {
    document.body.textContent = "";
    document.body.appendChild(stateBox("error", "AstrBot plugin view bridge is unavailable. Open this page from the AstrBot dashboard."));
    return;
  }
  await bridge.ready();
  bridge.onContext(() => {
    applyI18n();
    onContext();
  });
}

const API_TARGETS = ["stratz", "valve", "opendota"];
const state = { data: null, error: null, loading: true, checks: {} };
const $ = (id) => document.getElementById(id);

async function load() {
  state.loading = true;
  render();
  try {
    state.data = await bridge.apiGet("diagnostics");
    state.error = null;
  } catch (error) {
    state.error = error;
  } finally {
    state.loading = false;
    render();
  }
}

function card(titleKey, headExtra, ...body) {
  return h("section", { class: "card" },
    h("div", { class: "card-head" }, h("h2", { text: t(titleKey) }), h("span", { class: "spacer" }), headExtra),
    ...body);
}

function kv(rows) {
  return h("dl", { class: "kv" }, rows.map(([label, value]) => [h("dt", { text: label }), h("dd", {}, value)]));
}

/* ---------- API checks ---------- */
async function runCheck(target, button) {
  const ok = await askConfirm(t("views.diagnostics.confirmCheck", { target: t(`views.diagnostics.targets.${target}`) }), { danger: false, confirmText: t("views.diagnostics.check") });
  if (!ok) return;
  state.checks[target] = { running: true };
  render();
  try {
    state.checks[target] = await busy(button, () => bridge.apiPost("api-check", { target }));
  } catch (error) {
    state.checks[target] = { failed: errorText(error) };
  }
  render();
}

function checkResult(result) {
  if (!result) return h("span", { class: "muted small", text: t("views.diagnostics.notChecked") });
  if (result.running) return h("span", { class: "small" }, h("span", { class: "spinner" }), t("views.diagnostics.checking"));
  if (result.failed) return h("span", { class: "small", style: "color:var(--danger)", text: result.failed });
  return h("span", { class: "badges" },
    result.ok ? badge(t("views.diagnostics.reachable"), "ok") : badge(t("views.diagnostics.unreachable"), "danger"),
    h("span", { class: "small muted", text: `${fmtNumber(result.ms)} ms` }),
    result.message ? h("code", { text: result.message }) : null);
}

function apiCard(d) {
  const q = d.queues || {};
  return card("views.diagnostics.apiChecks", null,
    API_TARGETS.map((target) => {
      const disabled = target === "opendota" && (q.opendota === null || q.opendota === undefined);
      const btn = h("button", { type: "button", class: "small", text: t("views.diagnostics.check"), disabled: disabled || (state.checks[target] && state.checks[target].running) });
      btn.addEventListener("click", () => runCheck(target, btn));
      return h("div", { class: "check-row" },
        h("span", { class: "name", text: t(`views.diagnostics.targets.${target}`) }),
        h("span", { class: "small muted", text: disabled ? t("views.diagnostics.queueDisabled") : t("views.diagnostics.queue", { n: fmtNumber(q[target]) }) }),
        btn,
        h("span", { class: "result" }, disabled ? null : checkResult(state.checks[target])));
    }));
}

/* ---------- cache ---------- */
async function clearCache(namespace, button) {
  const message = namespace === "*expired" ? t("views.diagnostics.confirmPurge") : t("views.diagnostics.confirmClear", { namespace });
  if (!(await askConfirm(message, { confirmText: t("views.diagnostics.clear") }))) return;
  try {
    const result = await busy(button, () => bridge.apiPost("cache/clear", { namespace }));
    state.data.cache = result.cache;
    const removed = Object.values(result.removed || {}).reduce((a, b) => a + (Number(b) || 0), 0);
    toast(t("views.diagnostics.cleared", { n: fmtNumber(removed) }), "ok");
  } catch (error) {
    toast(errorText(error), "danger");
  }
  render();
}

function cacheCard(d) {
  const rows = d.cache || [];
  const purge = h("button", { type: "button", class: "small danger", text: t("views.diagnostics.purgeExpired") });
  purge.addEventListener("click", () => clearCache("*expired", purge));
  const col = (k) => t(`views.diagnostics.cacheCols.${k}`);
  return card("views.diagnostics.cache", purge,
    rows.length ? h("div", { class: "table-wrap" }, h("table", { class: "responsive" },
      h("thead", {}, h("tr", {}, ["namespace", "entries", "bytes", "expired"].map((k) => h("th", { text: col(k) })), h("th", {}))),
      h("tbody", {}, rows.map((row) => {
        const btn = h("button", { type: "button", class: "small danger", text: t("views.diagnostics.clear") });
        btn.addEventListener("click", () => clearCache(row.namespace, btn));
        return h("tr", {},
          h("td", { "data-label": col("namespace") }, h("code", { text: row.namespace })),
          h("td", { "data-label": col("entries"), text: fmtNumber(row.entries) }),
          h("td", { "data-label": col("bytes"), text: fmtBytes(row.bytes) }),
          h("td", { "data-label": col("expired") }, row.expired ? badge(fmtNumber(row.expired), "warn") : "0"),
          h("td", { class: "actions" }, btn));
      })))) : stateBox("empty", t("views.diagnostics.cacheEmpty")));
}

/* ---------- state, issues, errors, audit ---------- */
function stateCard(d) {
  const s = d.scheduler || {};
  const c = d.counts || {};
  return card("views.diagnostics.runtime", null, kv([
    [t("views.diagnostics.schemaVersion"), String(d.schemaVersion ?? "-")],
    [t("views.overview.scheduler"), s.running ? badge(t("views.common.running"), "ok") : badge(t("views.common.stopped"), "warn")],
    [t("views.overview.startedAt"), fmtTime(s.startedAt)],
    [t("views.overview.ticks"), fmtNumber(s.ticks)],
    [t("views.overview.activeJobs"), fmtNumber(s.activeJobs)],
    ...Object.entries(c).map(([key, value]) => [t(`views.diagnostics.countLabels.${key}`, null, key), fmtNumber(value)]),
  ]));
}

function issuesCard(d) {
  const issues = d.issues || [];
  return card("views.diagnostics.configCheck", null,
    issues.length ? h("ul", { class: "plain" }, issues.map((i) => h("li", { class: "badges" },
      badge(t(`views.common.level.${i.level}`, null, i.level), i.level === "error" ? "danger" : "warn"),
      h("code", { text: i.field }), h("span", { text: i.message }))))
      : h("div", { class: "banner ok", text: t("views.diagnostics.configOk") }),
    h("details", { style: "margin-top:10px" },
      h("summary", { class: "small", text: t("views.diagnostics.redactedConfig") }),
      h("pre", { class: "config", text: JSON.stringify(d.config || {}, null, 2) })));
}

function errorsCard(d) {
  const errors = d.recentErrors || [];
  const clearBtn = h("button", { type: "button", class: "small danger", text: t("views.diagnostics.clearErrors"), disabled: !errors.length });
  clearBtn.addEventListener("click", async () => {
    if (!(await askConfirm(t("views.diagnostics.confirmClearErrors"), { confirmText: t("views.diagnostics.clear") }))) return;
    try {
      await busy(clearBtn, () => bridge.apiPost("errors/clear", {}));
      state.data.recentErrors = [];
      toast(t("views.diagnostics.errorsCleared"), "ok");
    } catch (error) {
      toast(errorText(error), "danger");
    }
    render();
  });
  const col = (k) => t(`views.common.errorCols.${k}`);
  return card("views.overview.recentErrors", clearBtn,
    errors.length ? h("div", { class: "table-wrap" }, h("table", { class: "responsive" },
      h("thead", {}, h("tr", {}, ["time", "source", "type", "message"].map((k) => h("th", { text: col(k) })))),
      h("tbody", {}, errors.map((e) => h("tr", {},
        h("td", { "data-label": col("time"), class: "small", text: fmtTime(e.timestamp) }),
        h("td", { "data-label": col("source") }, h("code", { text: e.source || "-" })),
        h("td", { "data-label": col("type"), text: e.type }),
        h("td", { "data-label": col("message") }, h("code", { text: e.message })))))))
      : stateBox("empty", t("views.overview.noErrors")));
}

function auditCard(d) {
  const audit = d.audit || [];
  const col = (k) => t(`views.diagnostics.auditCols.${k}`);
  return card("views.diagnostics.audit", null,
    audit.length ? h("div", { class: "table-wrap" }, h("table", { class: "responsive" },
      h("thead", {}, h("tr", {}, ["time", "actor", "action", "detail"].map((k) => h("th", { text: col(k) })))),
      h("tbody", {}, audit.map((a) => h("tr", {},
        h("td", { "data-label": col("time"), class: "small", text: fmtTime(a.created_at) }),
        h("td", { "data-label": col("actor") }, h("code", { text: a.actor })),
        h("td", { "data-label": col("action"), text: t(`views.diagnostics.actions.${a.action}`, null, a.action) }),
        h("td", { "data-label": col("detail") }, a.detail && Object.keys(a.detail).length ? h("code", { text: JSON.stringify(a.detail) }) : "-"))))))
      : stateBox("empty", t("views.diagnostics.auditEmpty")));
}

function render() {
  const content = $("content");
  $("reload").disabled = state.loading;
  if (state.loading && !state.data) return setContent(content, stateBox("loading"));
  if (!state.data) return setContent(content, stateBox("error", errorText(state.error), load));
  const d = state.data;
  setContent(content, h("div", { class: "stack" },
    h("div", { class: "grid" }, stateCard(d), apiCard(d)),
    issuesCard(d),
    cacheCard(d),
    errorsCard(d),
    auditCard(d)));
}

$("reload").addEventListener("click", load);
$("download").addEventListener("click", (event) => busy(event.currentTarget, async () => {
  try {
    await bridge.download("diagnostic-export", {}, "dota2tracker-diagnostics.json");
  } catch (error) {
    toast(errorText(error), "danger");
  }
}));

let started = false;
boot(() => {
  render();
  if (!started) {
    started = true;
    load();
  }
});
</script>
</body>
</html>
