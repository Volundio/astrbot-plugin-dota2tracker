<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="views.overview.title">Overview</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7f9;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --border: #dde1e6;
  --text: #1f2328;
  --muted: #646d78;
  --accent: #3b6fd8;
  --accent-text: #ffffff;
  --ok: #1d7f45;
  --ok-bg: #e3f4ea;
  --warn: #93600a;
  --warn-bg: #fdf2dc;
  --danger: #c0352b;
  --danger-bg: #fbe6e4;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  --overlay: rgba(15, 23, 42, 0.35);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #16181d;
  --surface: #1f2228;
  --surface-2: #272b33;
  --border: #353a44;
  --text: #e6e8eb;
  --muted: #9aa3ae;
  --accent: #6c9cff;
  --accent-text: #0e1420;
  --ok: #5fd08f;
  --ok-bg: #1b3326;
  --warn: #f0c063;
  --warn-bg: #3a2f17;
  --danger: #ff8a80;
  --danger-bg: #3d1f1d;
  --shadow: none;
  --overlay: rgba(0, 0, 0, 0.55);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 15px; margin: 0 0 10px; }
h3 { font-size: 14px; margin: 0; }
code, .mono { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.page-header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 14px; }
.page-header .spacer { flex: 1; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.stack > * + * { margin-top: 12px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.card-head h2, .card-head h3 { margin: 0; }
.card-head .spacer { flex: 1; }
dl.kv { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 4px 12px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.stat .value { font-size: 20px; font-weight: 600; }
.stat .label { color: var(--muted); font-size: 12px; }
button, .btn {
  font: inherit;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: 0.55; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
button.small { padding: 2px 8px; font-size: 12px; }
input[type="text"], input[type="search"], select {
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  min-width: 0;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
label.inline { display: inline-flex; align-items: center; gap: 6px; }
.badge {
  display: inline-block;
  padding: 0 8px;
  border-radius: 999px;
  font-size: 12px;
  line-height: 20px;
  background: var(--surface-2);
  color: var(--muted);
  white-space: nowrap;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.danger { background: var(--danger-bg); color: var(--danger); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid transparent; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.banner.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
.banner.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.state { padding: 24px 12px; text-align: center; color: var(--muted); }
.state.error { color: var(--danger); }
.state button { margin-top: 8px; }
.spinner {
  display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px;
  border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
td.actions { white-space: nowrap; text-align: right; }
td.actions button + button { margin-left: 6px; }
ul.plain { list-style: none; margin: 0; padding: 0; }
ul.plain li + li { margin-top: 6px; }
/* Narrow layout: tables collapse into labelled rows. */
@media (max-width: 640px) {
  body { padding: 10px; }
  table.responsive thead { display: none; }
  table.responsive, table.responsive tbody, table.responsive tr, table.responsive td { display: block; width: 100%; }
  table.responsive tr { border-bottom: 1px solid var(--border); padding: 6px 0; }
  table.responsive tr:last-child { border-bottom: none; }
  table.responsive td { border: none; padding: 2px 4px; display: flex; gap: 8px; }
  table.responsive td::before { content: attr(data-label); color: var(--muted); min-width: 96px; flex-shrink: 0; font-size: 12px; }
  table.responsive td.actions { justify-content: flex-start; text-align: left; }
  table.responsive td.actions::before { content: none; }
}
/* In-page confirm dialog (window.confirm is unavailable in the sandboxed iframe). */
.overlay {
  position: fixed; inset: 0; background: var(--overlay);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
}
.dialog {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px; width: min(420px, 100%); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}
.dialog p { margin: 8px 0 16px; overflow-wrap: anywhere; }
.dialog .toolbar { justify-content: flex-end; }
.toast-area { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: calc(100% - 32px); }
.toast { border-radius: 6px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15); }
.toast.ok { border-color: var(--ok); color: var(--ok); }
.toast.danger { border-color: var(--danger); color: var(--danger); }
.issue-list li { display: flex; gap: 8px; align-items: baseline; }
.pending-subs { margin: 0; padding-left: 16px; }
</style>
<script src="/api/plugin/page/bridge-sdk.js"></script>
</head>
<body>
<header class="page-header">
  <h1 data-i18n="views.overview.title">Overview</h1>
  <span id="version" class="muted small"></span>
  <span class="spacer"></span>
  <div class="toolbar">
    <span id="updated" class="muted small" aria-live="polite"></span>
    <label class="inline small"><input type="checkbox" id="auto"> <span data-i18n="views.overview.autoRefresh"></span></label>
    <button type="button" id="refresh" class="primary" data-i18n="views.overview.refresh"></button>
  </div>
</header>
<div id="banners"></div>
<main id="content"></main>

<script>
/* ---- shared helpers (identical in every dota2tracker view) ---- */
const bridge = window.AstrBotPluginView || null;

/** Translate a key relative to the plugin i18n root; `{name}` placeholders are filled from vars. */
function t(key, vars, fallback) {
  let text = bridge ? bridge.t(key, "") : "";
  if (!text) text = fallback !== undefined ? fallback : key;
  if (vars) {
    text = text.replace(/\{(\w+)\}/g, (m, name) => (vars[name] === undefined || vars[name] === null ? m : String(vars[name])));
  }
  return text;
}

function hasKey(key) {
  return Boolean(bridge && bridge.t(key, ""));
}

function locale() {
  return (bridge && bridge.getLocale()) || "zh-CN";
}

/** Apply data-i18n / data-i18n-title / data-i18n-placeholder / data-i18n-aria attributes. */
function applyI18n(root) {
  const scope = root || document;
  scope.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = t(node.dataset.i18n); });
  scope.querySelectorAll("[data-i18n-title]").forEach((node) => { node.title = t(node.dataset.i18nTitle); });
  scope.querySelectorAll("[data-i18n-placeholder]").forEach((node) => { node.placeholder = t(node.dataset.i18nPlaceholder); });
  scope.querySelectorAll("[data-i18n-aria]").forEach((node) => { node.setAttribute("aria-label", t(node.dataset.i18nAria)); });
  document.documentElement.lang = locale();
}

/** Build DOM safely: strings become text nodes, never HTML. */
function h(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (name === "class") node.className = value;
    else if (name === "text") node.textContent = value;
    else if (name.startsWith("on") && typeof value === "function") node.addEventListener(name.slice(2), value);
    else if (name in node && typeof value !== "string") node[name] = value;
    else node.setAttribute(name, value === true ? "" : String(value));
  }
  append(node, children);
  return node;
}

function append(node, children) {
  for (const child of children.flat(Infinity)) {
    if (child === undefined || child === null || child === false) continue;
    node.appendChild(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

function setContent(node, ...children) {
  return append(clear(node), children);
}

function fmtTime(unixSeconds) {
  if (unixSeconds === undefined || unixSeconds === null || unixSeconds === 0) return t("views.common.never");
  const date = new Date(Number(unixSeconds) * 1000);
  if (Number.isNaN(date.getTime())) return String(unixSeconds);
  try {
    return new Intl.DateTimeFormat(locale(), { dateStyle: "medium", timeStyle: "medium" }).format(date);
  } catch {
    return date.toLocaleString();
  }
}

function fmtNumber(value) {
  if (value === undefined || value === null) return "-";
  try {
    return new Intl.NumberFormat(locale()).format(value);
  } catch {
    return String(value);
  }
}

function fmtBytes(bytes) {
  const n = Number(bytes) || 0;
  if (n < 1024) return `${fmtNumber(n)} B`;
  if (n < 1024 * 1024) return `${fmtNumber(Math.round(n / 102.4) / 10)} KB`;
  return `${fmtNumber(Math.round(n / 104857.6) / 10)} MB`;
}

function badge(text, kind) {
  return h("span", { class: `badge ${kind || ""}`.trim(), text });
}

function yesNoBadge(value, onKey, offKey, offKind) {
  return value ? badge(t(onKey || "views.common.enabled"), "ok") : badge(t(offKey || "views.common.disabled"), offKind || "");
}

/** Map a bridge error (message is a backend error code) to translated text. */
function errorText(error) {
  const code = String((error && error.message) || error || "").trim();
  if (/^[a-z0-9_]+$/.test(code) && hasKey(`views.common.errors.${code}`)) return t(`views.common.errors.${code}`);
  if (/^invalid_[a-z0-9_]+$/.test(code)) return t("views.common.errors.invalid_param", { name: code.slice(8) });
  return t("views.common.errors.unknown", { message: code || "?" });
}

/** Loading / empty / error placeholder. */
function stateBox(kind, text, retry) {
  const box = h("div", { class: `state ${kind}`, role: kind === "error" ? "alert" : "status" });
  if (kind === "loading") box.appendChild(h("span", { class: "spinner", "aria-hidden": "true" }));
  box.appendChild(document.createTextNode(text || t(`views.common.${kind}`)));
  if (retry) box.append(h("br"), h("button", { type: "button", onclick: retry, text: t("views.common.retry") }));
  return box;
}

let toastArea = null;
function toast(text, kind) {
  if (!toastArea) {
    toastArea = h("div", { class: "toast-area", role: "status", "aria-live": "polite" });
    document.body.appendChild(toastArea);
  }
  const node = h("div", { class: `toast ${kind || ""}`, text });
  toastArea.appendChild(node);
  setTimeout(() => node.remove(), kind === "danger" ? 6000 : 3000);
}

/** In-page confirmation dialog; resolves true/false. */
function askConfirm(message, { title, confirmText, danger = true } = {}) {
  return new Promise((resolve) => {
    const previous = document.activeElement;
    const close = (result) => {
      overlay.remove();
      document.removeEventListener("keydown", onKey);
      if (previous && previous.focus) previous.focus();
      resolve(result);
    };
    const onKey = (event) => { if (event.key === "Escape") close(false); };
    const ok = h("button", { type: "button", class: danger ? "danger" : "primary", text: confirmText || t("views.common.confirm"), onclick: () => close(true) });
    const overlay = h("div", { class: "overlay", onclick: (event) => { if (event.target === overlay) close(false); } },
      h("div", { class: "dialog", role: "alertdialog", "aria-modal": "true" },
        h("h3", { text: title || t("views.common.confirmTitle") }),
        h("p", { text: message }),
        h("div", { class: "toolbar" },
          h("button", { type: "button", text: t("views.common.cancel"), onclick: () => close(false) }),
          ok)));
    document.addEventListener("keydown", onKey);
    document.body.appendChild(overlay);
    ok.focus();
  });
}

/** Disable a button while an async action runs. */
async function busy(button, action) {
  if (button) button.disabled = true;
  try {
    return await action();
  } finally {
    if (button) button.disabled = false;
  }
}

/** Start the view: wait for the bridge context, then re-render on every language/theme change. */
async function boot(onContext) {
  if (!bridge) {
    document.body.textContent = "";
    document.body.appendChild(stateBox("error", "AstrBot plugin view bridge is unavailable. Open this page from the AstrBot dashboard."));
    return;
  }
  await bridge.ready();
  bridge.onContext(() => {
    applyI18n();
    onContext();
  });
}

const AUTO_REFRESH_MS = 30000;
const state = { data: null, error: null, loading: true, updatedAt: null };
let timer = null;

const $ = (id) => document.getElementById(id);

async function load(useRefresh) {
  state.loading = !state.data;
  if (!state.data) render();
  try {
    state.data = useRefresh ? await bridge.apiPost("refresh", {}) : await bridge.apiGet("status");
    state.error = null;
    state.updatedAt = Date.now() / 1000;
    if (useRefresh) toast(t("views.overview.refreshed"), "ok");
  } catch (error) {
    state.error = error;
    if (state.data) toast(errorText(error), "danger");
  } finally {
    state.loading = false;
    render();
  }
}

function setAuto(enabled) {
  clearInterval(timer);
  timer = null;
  if (enabled) {
    timer = setInterval(() => {
      if (!document.hidden) load(false);
    }, AUTO_REFRESH_MS);
  }
}

function card(titleKey, ...body) {
  return h("section", { class: "card" }, h("h2", { text: t(titleKey) }), ...body);
}

function kv(rows) {
  return h("dl", { class: "kv" }, rows.map(([key, value]) => [h("dt", { text: t(key) }), h("dd", {}, value)]));
}

function stat(labelKey, value) {
  return h("div", { class: "stat" }, h("div", { class: "value", text: fmtNumber(value) }), h("div", { class: "label", text: t(labelKey) }));
}

function renderBanners(d) {
  const banners = [];
  // Warn only when the backend reports that no messaging platform is running at all.
  if (d.platforms && Array.isArray(d.platforms.running) && d.platforms.running.length === 0) {
    banners.push(h("div", { class: "banner warn", role: "alert", text: t("views.common.noPlatform") }));
  } else if (d.platforms && d.platforms.onebot === false) {
    banners.push(h("div", { class: "banner info", role: "status", text: t("views.common.noOnebot") }));
  }
  if (!d.config.stratzToken) {
    banners.push(h("div", { class: "banner danger", role: "alert", text: t("views.overview.noStratzToken") }));
  }
  if (d.scheduler && !d.scheduler.running) {
    banners.push(h("div", { class: "banner warn", text: t("views.overview.schedulerStopped") }));
  }
  setContent($("banners"), banners);
}

function featuresCard(c) {
  return card("views.overview.features", kv([
    ["views.overview.stratzToken", yesNoBadge(c.stratzToken, "views.common.configured", "views.common.missing", "danger")],
    ["views.overview.opendota", yesNoBadge(c.opendota)],
    ["views.overview.rankBroadcast", yesNoBadge(c.rankBroadcast)],
    ["views.overview.dailyReport", yesNoBadge(c.dailyReport)],
    ["views.overview.weeklyReport", yesNoBadge(c.weeklyReport)],
  ]));
}

function schedulerCard(d) {
  const s = d.scheduler || {};
  return card("views.overview.scheduler", kv([
    ["views.overview.state", s.running ? badge(t("views.common.running"), "ok") : badge(t("views.common.stopped"), "warn")],
    ["views.overview.startedAt", fmtTime(s.startedAt)],
    ["views.overview.ticks", fmtNumber(s.ticks)],
    ["views.overview.activeJobs", fmtNumber(s.activeJobs)],
    ["views.overview.lastDiscovery", fmtTime(d.lastDiscovery)],
    ["views.overview.lastPoll", fmtTime(d.lastPoll)],
    ["views.overview.lastDaily", fmtTime(d.lastDaily)],
    ["views.overview.lastWeekly", fmtTime(d.lastWeekly)],
  ]));
}

function countsCard(d) {
  const c = d.counts || {};
  const memberGroups = Object.keys(d.members || {}).length;
  const memberTotal = Object.values(d.members || {}).reduce((a, b) => a + (Number(b) || 0), 0);
  return card("views.overview.counts",
    h("div", { class: "stats" },
      stat("views.overview.subscribedChannels", c.subscribed_channels),
      stat("views.overview.channels", c.channels),
      stat("views.overview.players", c.players),
      stat("views.overview.pendingMatches", c.pending_matches),
      stat("views.overview.sentMatches", c.sent_matches),
      stat("views.overview.matchExtensions", c.match_extensions)),
    h("p", { class: "muted small", text: t("views.overview.memberCache", { groups: fmtNumber(memberGroups), members: fmtNumber(memberTotal) }) }),
    h("p", { class: "muted small", text: d.openDotaCallsToday === null || d.openDotaCallsToday === undefined
      ? t("views.overview.openDotaCallsDisabled")
      : t("views.overview.openDotaCalls", { count: fmtNumber(d.openDotaCallsToday) }) }));
}

function rendererCard(d) {
  const r = d.renderer || {};
  const k = d.constants || {};
  return card("views.overview.rendererAndData", kv([
    ["views.overview.renders", fmtNumber(r.renders)],
    ["views.overview.renderFailures", r.failures ? badge(fmtNumber(r.failures), "danger") : "0"],
    ["views.overview.lastRenderMs", r.last_duration === null || r.last_duration === undefined ? "-" : `${fmtNumber(Math.round(r.last_duration * 1000))} ms`],
    ["views.overview.lastRenderError", r.last_error ? h("code", { text: r.last_error }) : "-"],
    ["views.overview.constantsVersion", `${k.version || "-"} (${k.source || "-"})`],
    ["views.overview.constantsSize", t("views.overview.constantsSizeValue", { heroes: fmtNumber(k.heroes), items: fmtNumber(k.items), abilities: fmtNumber(k.abilities) })],
  ]));
}

function issuesCard(issues) {
  if (!issues || !issues.length) return null;
  return card("views.overview.configIssues", h("ul", { class: "plain issue-list" }, issues.map((issue) =>
    h("li", {},
      badge(t(`views.common.level.${issue.level}`, null, issue.level), issue.level === "error" ? "danger" : "warn"),
      h("code", { text: issue.field }),
      h("span", { text: issue.message })))));
}

function pendingCard(pending) {
  const body = !pending || !pending.length
    ? stateBox("empty", t("views.overview.noPending"))
    : h("div", { class: "table-wrap" }, h("table", { class: "responsive" },
      h("thead", {}, h("tr", {}, ["matchId", "requestTime", "waiting", "subscribers"].map((k) => h("th", { text: t(`views.overview.pendingCols.${k}`) })))),
      h("tbody", {}, pending.map((p) => h("tr", {},
        h("td", { "data-label": t("views.overview.pendingCols.matchId") }, h("code", { text: String(p.matchId) })),
        h("td", { "data-label": t("views.overview.pendingCols.requestTime"), text: fmtTime(p.requestTime) }),
        h("td", { "data-label": t("views.overview.pendingCols.waiting"), text: t("views.overview.minutes", { n: fmtNumber(p.waitingMinutes) }) }),
        h("td", { "data-label": t("views.overview.pendingCols.subscribers") },
          h("ul", { class: "pending-subs" }, (p.subscribers || []).map((s) =>
            h("li", { class: "small" }, `${s.platform}:${s.channelId} · ${t(`views.overview.subscriberType.${s.type}`, null, s.type)} · ${t(`views.overview.subscriberSource.${s.source}`, null, s.source)}`)))))))));
  return h("section", { class: "card" }, h("h2", { text: `${t("views.overview.pending")} (${(pending || []).length})` }), body);
}

function errorsCard(errors) {
  const body = !errors || !errors.length
    ? stateBox("empty", t("views.overview.noErrors"))
    : h("div", { class: "table-wrap" }, h("table", { class: "responsive" },
      h("thead", {}, h("tr", {}, ["time", "source", "type", "message"].map((k) => h("th", { text: t(`views.common.errorCols.${k}`) })))),
      h("tbody", {}, errors.map((e) => h("tr", {},
        h("td", { "data-label": t("views.common.errorCols.time"), text: fmtTime(e.timestamp) }),
        h("td", { "data-label": t("views.common.errorCols.source") }, h("code", { text: e.source || "-" })),
        h("td", { "data-label": t("views.common.errorCols.type"), text: e.type }),
        h("td", { "data-label": t("views.common.errorCols.message") }, h("code", { text: e.message })))))));
  return h("section", { class: "card" }, h("h2", { text: t("views.overview.recentErrors") }), body);
}

function render() {
  const content = $("content");
  $("updated").textContent = state.updatedAt ? t("views.overview.updatedAt", { time: fmtTime(state.updatedAt) }) : "";
  $("refresh").disabled = state.loading;
  if (state.loading && !state.data) {
    setContent(content, stateBox("loading"));
    return;
  }
  if (!state.data) {
    setContent($("banners"));
    setContent(content, stateBox("error", errorText(state.error), () => load(false)));
    return;
  }
  const d = state.data;
  $("version").textContent = `${d.plugin.name} v${d.plugin.version}`;
  renderBanners(d);
  setContent(content,
    h("div", { class: "stack" },
      issuesCard(d.config.issues),
      h("div", { class: "grid" }, featuresCard(d.config), schedulerCard(d), countsCard(d), rendererCard(d)),
      pendingCard(d.pending),
      errorsCard(d.recentErrors),
      h("p", { class: "muted small", text: t("views.overview.upstream", { url: d.plugin.upstream }) })));
}

$("refresh").addEventListener("click", () => busy($("refresh"), () => load(true)));
$("auto").addEventListener("change", (event) => setAuto(event.target.checked));
window.addEventListener("pagehide", () => setAuto(false));
window.addEventListener("beforeunload", () => setAuto(false));

let started = false;
boot(() => {
  render();
  if (!started) {
    started = true;
    load(false);
  }
});
</script>
</body>
</html>
